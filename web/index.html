<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Thread Queue Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <span class="badge">Live Production</span>
            <h1>Java Telemetry Dashboard</h1>
            <p>Resource-Constrained Thread Pool Monitoring</p>
        </header>

        <div id="loading-box" class="card">
            <div class="loader"></div>
            <h2 id="queue-status">Waiting for Worker Slot...</h2>
            <p>Your request is currently held in the <code>LinkedBlockingQueue</code>.</p>
            <div id="timer" style="margin-top: 15px; color: var(--accent); font-weight: bold; font-family: monospace;">Time in queue: 0s</div>
        </div>

        <div id="data-box" class="card hidden">
            <div class="success-header">
                <h2>✓ Thread Occupied</h2>
            </div>
            <p style="text-align: center; margin-bottom: 15px;">You are currently holding a Worker Thread hostage.</p>
            <div class="grid">
                <div class="stat-item"><label>Status</label><span id="t-id" style="color: #34d399;">CONNECTED</span></div>
            </div>
            <button class="btn" style="background: #ef4444;" onclick="location.reload()">Disconnect (Release Thread)</button>
        </div>

        <div class="console">
            <div class="console-header">System Logs</div>
            <div id="logs" class="log-entries"></div>
        </div>
    </div>

    <script>
        const log = (msg, color = "#34d399") => {
            const div = document.createElement('div');
            div.className = 'log';
            div.style.color = color;
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('logs').prepend(div);
        };

        async function runTest() {
            const startTime = Date.now();
            const timerEl = document.getElementById('timer');
            
            // Update the timer every second
            const interval = setInterval(() => {
                timerEl.innerText = `Time in queue: ${Math.floor((Date.now() - startTime) / 1000)}s`;
            }, 1000);

            log('Attempting to connect to backend...');

            /**
             * We use EventSource because it's designed for long-running connections.
             * The server will keep this connection open until the user closes the tab.
             */
            const eventSource = new EventSource('/status');

            // This triggers as soon as the server accepts the connection (the thread is now busy)
            eventSource.onopen = () => {
                clearInterval(interval);
                log('SUCCESS: Thread captured!');
                document.getElementById('loading-box').classList.add('hidden');
                document.getElementById('data-box').classList.remove('hidden');
            };

            // This triggers if the connection drops or the server is full/down
            eventSource.onerror = (err) => {
                // If we haven't connected yet, it's just waiting in queue
                if (eventSource.readyState === EventSource.CONNECTING) {
                    console.log("Waiting in queue...");
                } else {
                    log('DISCONNECTED: Thread released.', '#ef4444');
                    eventSource.close();
                }
            };
        }

        // Start the test immediately on page load
        runTest();
    </script>
</body>
</html>
