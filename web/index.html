<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Telemetry Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <span class="badge">Live Production</span>
            <h1>Java Telemetry Dashboard</h1>
            <p>Real-Time Thread Pool Monitoring</p>
        </header>

        <div id="loading-box" class="card">
            <div class="loader"></div>
            <h2>Waiting for Worker Slot...</h2>
            <p id="queue-timer" style="color: #60a5fa; font-weight: bold; font-family: monospace;">Time in queue: 0s</p>
        </div>

        <div id="data-box" class="card hidden">
            <div class="success-header"><h2>✓ Thread Captured</h2></div>
            <div class="grid">
                <div class="stat-item"><label>Worker Thread</label><span id="t-id">...</span></div>
                <div class="stat-item"><label>Active Workers</label><span id="t-active">...</span></div>
                <div class="stat-item"><label>Queue Depth</label><span id="t-queue">...</span></div>
                <div class="stat-item"><label>Capture Time</label><span id="t-time">...</span></div>
            </div>
            <button class="btn" style="background: #ef4444; margin-top: 20px;" onclick="location.reload()">Release Thread</button>
        </div>

        <div class="console">
            <div class="console-header">System Logs</div>
            <div id="logs" class="log-entries"></div>
        </div>
    </div>

    <script>
        const log = (msg, color = "#34d399") => {
            const div = document.createElement('div');
            div.className = 'log';
            div.style.color = color;
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('logs').prepend(div);
        };

        async function connect() {
            const startTime = Date.now();
            const timerEl = document.getElementById('queue-timer');
            const interval = setInterval(() => {
                timerEl.innerText = `Time in queue: ${Math.floor((Date.now() - startTime) / 1000)}s`;
            }, 1000);

            log('Request sent to LinkedBlockingQueue...');

            try {
                const response = await fetch('/status');
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                const { value } = await reader.read();
                const jsonStr = decoder.decode(value).split('\n')[0];
                const data = JSON.parse(jsonStr);

                clearInterval(interval);
                log(`Success! Captured by ${data.thread}`);

                document.getElementById('loading-box').classList.add('hidden');
                document.getElementById('data-box').classList.remove('hidden');
                document.getElementById('t-id').innerText = data.thread;
                document.getElementById('t-active').innerText = `${data.active}/3`;
                document.getElementById('t-queue').innerText = data.queue;
                document.getElementById('t-time').innerText = data.time;

            } catch (err) {
                log('FAILED: Connection dropped', '#ef4444');
            }
        }
        connect();
    </script>
</body>
</html>
