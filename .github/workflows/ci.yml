name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Java sources
        run: |
          mkdir -p out
          find src -name "*.java" -print | xargs javac -d out || true

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/multithreaded-web-server-java:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and smoke test
        env:
          PORT: 8080
        run: |
          docker run -d --name server-test -p 8080:8080 ghcr.io/${{ github.repository_owner }}/multithreaded-web-server-java:latest || docker logs server-test || true
          sleep 5
          if ! curl --fail http://localhost:8080/; then
            echo "Server did not respond"; docker logs server-test; exit 1; fi
          docker stop server-test
